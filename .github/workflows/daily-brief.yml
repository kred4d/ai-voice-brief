name: Daily AI Voice Brief

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 1-5"

permissions:
  contents: write

jobs:
  update-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Confirm briefing feed
        run: |
          echo "AI Voice Brief workflow is running."
          test -f briefing.json
          python -m json.tool briefing.json > /dev/null
          echo "briefing.json is valid JSON."
